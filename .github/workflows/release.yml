name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read and check the version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version $version"
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libvpx
        run: brew install libvpx pkg-config
      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles app,dmg
      - name: Collect
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          bundle=target/release/bundle
          mkdir -p dist
          cp "$bundle/dmg/StaDesk_${version}_aarch64.dmg" dist/
          cp "$bundle/macos/StaDesk.app.tar.gz" "dist/StaDesk_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/StaDesk.app.tar.gz.sig" "dist/StaDesk_${version}_aarch64.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev nasm \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev file
      - name: Build libvpx
        run: |
          prefix="$(tools/linux/build-libvpx.sh)"
          echo "VPX_LIB_DIR=$prefix/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$prefix/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=1.17.0" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles deb,appimage
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find target/release/bundle/deb -name '*.deb' -exec cp {} dist/ \;
          find target/release/bundle/appimage -name '*.AppImage*' -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm nsis clang libclang-dev
      - name: Build
        run: |
          (cd app && npm ci)
          tools/windows/package.sh
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find target/x86_64-pc-windows-gnu/release/bundle/nsis -name '*-setup.exe*' -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes and update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$previous..${GITHUB_REF_NAME}" > notes.md
          else
            git log --no-merges --format='- %s' "${GITHUB_REF_NAME}" > notes.md
          fi
          python3 .github/scripts/update_manifest.py dist "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" notes.md > dist/latest.json
          cat dist/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(dist/*)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "StaDesk ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
