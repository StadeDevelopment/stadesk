[package]
name = "stadesk-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stadesk-core = { version = "0.1.0", path = "../../crates/stadesk-core" }
stadesk-desktop = { version = "0.1.0", path = "../../crates/stadesk-desktop" }
stadesk-net = { version = "0.1.0", path = "../../crates/stadesk-net" }
stadesk-session = { version = "0.1.0", path = "../../crates/stadesk-session" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-updater = "2.14.1"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
