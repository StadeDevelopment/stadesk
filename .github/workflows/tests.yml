name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev nasm \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev
      - name: Build libvpx
        run: |
          prefix="$(tools/linux/build-libvpx.sh)"
          echo "VPX_LIB_DIR=$prefix/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$prefix/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=1.17.0" >> "$GITHUB_ENV"
      - name: Build the web UI
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
