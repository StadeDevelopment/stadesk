[package]
name = "stadesk-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake2 = "0.11.0"
getrandom = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
stadesk-core = { version = "0.1.0", path = "../stadesk-core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
zeroize = "1.9.2"
